name: NGO Grants Bot

on:
  workflow_dispatch:

# Раніше тут був ще й власний schedule (GitHub Actions cron) паралельно
# із зовнішнім тригером cron-job.org — обидва спрацьовували близько
# один до одного, і навіть з concurrency це створювало накладки й
# чергу запусків. Тепер єдине джерело тригера — cron-job.org
# (workflow_dispatch раз на годину). schedule прибрано повністю.

# concurrency лишається про запас: якщо колись з'явиться ще одне
# джерело тригера (ручний запуск + cron-job.org одночасно), це
# все одно захистить posted_links.txt від конфлікту при коміті.
concurrency:
  group: ngo-grants-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          python bot.py

      - name: Commit posted_links
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update posted_links
