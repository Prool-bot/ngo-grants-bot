name: NGO Grants Bot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      alerts_replay:
        description: "Перевірити поточні Google Alerts без публікацій"
        type: boolean
        default: false

# Раніше тут був ще й власний schedule (GitHub Actions cron) паралельно
# із зовнішнім тригером cron-job.org — обидва спрацьовували близько
# один до одного, і навіть з concurrency це створювало накладки й
# чергу запусків. Тепер єдине джерело тригера — cron-job.org
# (workflow_dispatch раз на годину). schedule прибрано повністю.

# concurrency лишається про запас: якщо колись з'явиться ще одне
# джерело тригера (ручний запуск + cron-job.org одночасно), це
# все одно захистить posted_links.txt від конфлікту при коміті.
concurrency:
  group: ngo-grants-bot
  cancel-in-progress: false

jobs:
  run-bot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          GOOGLE_ALERTS_DRY_RUN: ${{ inputs.alerts_replay && '1' || '0' }}
          GOOGLE_ALERTS_REPLAY: ${{ inputs.alerts_replay && '1' || '0' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          python bot.py

      - name: Commit posted_links
        if: ${{ !inputs.alerts_replay }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update posted_links

  verify-alerts:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/google-alerts-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py
      - run: python -u bot.py
        env:
          GOOGLE_ALERTS_DRY_RUN: '1'
          GOOGLE_ALERTS_REPLAY: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
