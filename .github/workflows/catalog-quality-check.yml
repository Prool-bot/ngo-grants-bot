name: Catalog quality regression tests
on:
  pull_request:
    paths:
      - 'catalog_quality.py'
      - 'tests/test_catalog_quality.py'
      - '.github/workflows/catalog-quality-check.yml'
  push:
    branches: [main, improve-catalog-quality-2026-11-28]
    paths:
      - 'catalog_quality.py'
      - 'tests/test_catalog_quality.py'
      - '.github/workflows/catalog-quality-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run grant catalog quality regressions
        run: python -m unittest discover -s tests -p 'test_catalog_quality.py' -v
